project_id = "kiasujobs"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

# Local mailbox — signup/reset emails land here instead of being sent.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
# The Expo dev-client and standalone-app deep links must be allow-listed here
# or Google OAuth will refuse to redirect back into the app.
additional_redirect_urls = [
  "http://localhost:3000",
  "kiasujobs://",
  "kiasujobs://auth/callback",
  "exp://localhost:8081",
  "exp://127.0.0.1:8081",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
# Off locally so seeded/dev accounts can sign in immediately.
enable_confirmations = false

# Fill these in and flip `enabled` to test Google sign-in locally.
# See README → "Google OAuth".
[auth.external.google]
enabled = false
client_id = ""
secret = ""
redirect_uri = ""
